name: Continuous Integration

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expense_db
          POSTGRES_USER: expense_user
          POSTGRES_PASSWORD: expense_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run Integration & Unit Tests with PostgreSQL
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/expense_db
          SPRING_DATASOURCE_USERNAME: expense_user
          SPRING_DATASOURCE_PASSWORD: expense_password
          JWT_SECRET_KEY: super-secret-jwt-signing-key-for-kpi-lab4-256bits-minimum
        run: ./mvnw clean verify

      - name: Build Docker Image
        run: docker build -t server-app:latest .

      - name: Validate Docker Compose Configuration
        run: docker compose config